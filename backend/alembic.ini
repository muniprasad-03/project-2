[alembic]
# Path to the migration scripts.
script_location = alembic

# Use the current project directory as the Python import root.
prepend_sys_path = .

# Migration file naming format.
file_template = %%(rev)s_%%(slug)s

# Timezone used for migration timestamps.
# Leave unset so Alembic uses the system/default timezone.
# timezone =

# Maximum length of generated migration slug.
truncate_slug_length = 40


[post_write_hooks]
# No post-write hooks are required for this project.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s