version: '3.8'

services:
  backend:
    build: .
    container_name: buildonce-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/buildonce
      - SUPABASE_URL=${SUPABASE_URL:-mock}
      - SUPABASE_KEY=${SUPABASE_KEY:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: buildonce-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=buildonce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
